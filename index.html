<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترتيب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.lang='ar';document.documentElement.dir='rtl';</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: quiet top bar · page header with one status line · two-column grid (savings chart | month summary), (sections table | goal) · compact achievements. Mobile: one column + bottom tab bar. */
:root{
  --bg:#F6F7F6; --surface:#FFFFFF; --surface-2:#F1F3F2; --ink:#111816; --ink-2:#56625E; --ink-3:#8B9692; --line:#E4E8E6;
  --brand:#0E6B57; --brand-ink:#FFFFFF; --brand-soft:#E2F0EB; --brand-mid:#9BCDBE;
  --good:#167D54; --good-soft:#E3F3EA; --warn:#A8650A; --warn-soft:#FBF0DC; --bad:#BF3440; --bad-soft:#FBE7E9;
  --gold:#9C7210; --gold-soft:#F7EFD9; --overlay:rgba(10,16,14,.45);
  --r:14px;
  --f:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1211; --surface:#141B19; --surface-2:#1B2421; --ink:#E9EFEC; --ink-2:#A2AEA9; --ink-3:#6F7B77; --line:#253130;
  --brand:#4CC7A0; --brand-ink:#05201A; --brand-soft:#16312A; --brand-mid:#2D6E5C;
  --good:#4FCB8F; --good-soft:#143424; --warn:#E9A23E; --warn-soft:#3A2B12; --bad:#F2727C; --bad-soft:#3D1D21;
  --gold:#E3BC5A; --gold-soft:#352C14; --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1211; --surface:#141B19; --surface-2:#1B2421; --ink:#E9EFEC; --ink-2:#A2AEA9; --ink-3:#6F7B77; --line:#253130;
  --brand:#4CC7A0; --brand-ink:#05201A; --brand-soft:#16312A; --brand-mid:#2D6E5C;
  --good:#4FCB8F; --good-soft:#143424; --warn:#E9A23E; --warn-soft:#3A2B12; --bad:#F2727C; --bad-soft:#3D1D21;
  --gold:#E3BC5A; --gold-soft:#352C14; --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;line-height:1.3;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{display:inline-block;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.005em}
.cur{font-size:.78em;color:var(--ink-3);font-weight:400;margin-inline-start:4px}
.mny{white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:12.5px;color:var(--ink-2)}
.label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.eyebrow{font-size:12.5px;color:var(--ink-3)}
.app{max-width:1200px;margin:0 auto;padding-bottom:64px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:12px;height:64px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px;flex:none}
.nav{display:flex;gap:2px;margin-inline-start:24px}
.nav button,.tabbar button{border:0;background:transparent;color:var(--ink-2);padding:7px 12px;border-radius:8px;font-weight:500;display:flex;align-items:center;gap:7px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.nav svg,.tabbar svg{width:17px;height:17px}
.tools{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.monthsw{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);height:36px}
.monthsw span{min-width:104px;text-align:center;font-weight:500;font-size:13.5px}
.ibtn{width:34px;height:34px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);flex:none}
.ibtn:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.ibtn:disabled{opacity:.3;cursor:default}
.ibtn svg{width:18px;height:18px}
.ibtn.solid{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px}
.tabbar,.fab{display:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px}
.btn{border:0;border-radius:10px;height:40px;padding:0 16px;font-weight:600;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--bad);color:#fff}
.btn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gold{background:var(--gold-soft);color:var(--gold)}
.neg{color:var(--bad)}.pos{color:var(--good)}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;margin-top:16px}
.banner .tag{background:var(--gold-soft);color:var(--gold);font-weight:600;font-size:12px;padding:2px 8px;border-radius:6px}
.banner .grow{flex:1;min-width:180px}

.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:28px 0 20px}
.page-h h1{font-size:26px;letter-spacing:-.01em}
.status{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--ink-2);font-size:14px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.status.warn i{background:var(--warn)}.status.bad i{background:var(--bad)}.status.neutral i{background:var(--ink-3)}

/* home */
.grid-a{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
.big{font-size:clamp(32px,4.4vw,44px);font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.big .cur{font-size:.38em}
.deltas{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink-2)}
.delta{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:6px;font-weight:600;background:var(--good-soft);color:var(--good)}
.delta.down{background:var(--bad-soft);color:var(--bad)}
.chartwrap{position:relative;margin-top:14px;direction:ltr}
.chartwrap svg{width:100%;height:auto;display:block;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-txt{fill:var(--ink-3);font-size:11.5px;font-family:var(--f)}
.ch-line{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ch-line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .1s cubic-bezier(.3,.7,.2,1) forwards}
.ch-area.draw{opacity:0;animation:fade .8s .6s ease forwards}
.ch-proj{fill:none;stroke:var(--ink-3);stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round}
.ch-dot{fill:var(--surface);stroke:var(--brand);stroke-width:2}
.ch-dot.sel{fill:var(--brand);stroke:var(--surface);stroke-width:2.5}
.ch-hit{fill:transparent}
.ch-tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 24px -8px rgba(0,0,0,.25);border:1px solid var(--line);transform:translate(-50%,-115%);white-space:nowrap;opacity:0;transition:opacity .12s;direction:rtl;z-index:3}
.ch-tip.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);gap:2px;margin:4px 0 14px}
.stackbar i{display:block;height:100%;transition:width .8s}
.rows{margin:0;display:flex;flex-direction:column}
.rows>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rows>div:first-child{border-top:0}
.rows dt{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.rows dt i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.rows dd{margin:0}
.rows .total{font-weight:600;color:var(--ink)}
.pacebox{margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.pace{height:6px;border-radius:3px;background:var(--surface-2);position:relative;margin:8px 0 6px}
.pace i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:3px;background:var(--brand)}
.pace i.bad{background:var(--bad)}
.pace u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}

.sthead,.srow{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1.5fr) minmax(0,.9fr) minmax(0,.9fr);gap:16px;align-items:center}
.sthead{font-size:12px;color:var(--ink-3);padding:0 8px 8px;border-bottom:1px solid var(--line)}
.sthead span:nth-child(n+3){text-align:end}
.srow{width:100%;border:0;background:transparent;text-align:start;padding:12px 8px;border-bottom:1px solid var(--line);color:inherit;font:inherit}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--surface-2)}
.sname{display:flex;align-items:center;gap:10px;min-width:0}
.sname b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname small{display:block;color:var(--ink-3);font-size:12px}
.dotic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex:none}
.dotic svg{width:16px;height:16px}
.bar{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .8s cubic-bezier(.3,.7,.2,1);border-radius:3px}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.barcell{display:flex;flex-direction:column;gap:5px;min-width:0}
.barcell small{font-size:12px;color:var(--ink-3)}
.tnum{text-align:end}
.tnum small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}

.goal-top{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:var(--surface-2)}
.ring .pg{stroke:var(--brand);transition:stroke-dasharray 1.1s cubic-bezier(.3,.7,.2,1)}
.ring .tx{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:18px}
.gname{display:block;font-size:16px;font-weight:600;margin-bottom:2px}
.eta{font-size:13.5px;color:var(--ink-2);margin:16px 0 14px;line-height:1.7}
.eta b{color:var(--ink);font-weight:600}
.sim label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--brand);height:22px;margin:0}
.streak{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.streak-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.streak-h b{font-size:18px}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.dots i.on{background:var(--good)}.dots i.off{background:var(--bad)}

.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.bd{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.bd .em{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);flex:none}
.bd .em svg{width:16px;height:16px}
.bd b{display:block;font-size:13px;font-weight:600}
.bd small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.4}
.bd.lock .em{background:var(--surface-2);color:var(--ink-3)}
.bd.lock b{color:var(--ink-2)}
.mini{height:3px;border-radius:2px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ink-3)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.field label>span{font-size:12.5px;color:var(--ink-2);font-weight:500}
.inp,select.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.inp.num{direction:ltr;text-align:right;font-weight:600}
.inp.lg{font-size:22px;min-height:52px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 12px;min-height:38px}

/* welcome */
.welcome{max-width:720px;margin:48px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px}
.w-top h1{font-size:26px;margin:4px 0 10px}
.w-top p{max-width:60ch}
.w-steps{list-style:none;margin:24px 0;padding:0;display:flex;flex-direction:column;gap:14px}
.w-steps li{display:flex;gap:12px;align-items:flex-start}
.w-steps b{display:block;font-weight:600}.w-steps small{color:var(--ink-2);font-size:13px}
.w-acts{display:flex;gap:10px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
@media (max-width:720px){.welcome{margin-top:24px;padding:20px}.w-top h1{font-size:22px}}
/* budget */
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:700;margin-inline-end:8px;vertical-align:1px}
.income{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:start}
.fixlist{display:flex;flex-direction:column;gap:8px}
.fixrow{display:grid;grid-template-columns:minmax(0,1fr) 140px 40px;gap:8px;align-items:center}
.remain{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:end;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.suggest{margin-top:16px;padding:16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.suggest .rows dd{display:flex;align-items:center}
.inp.amt{min-height:38px;padding:4px 10px;width:100%;max-width:150px}
.ua{display:flex;flex-direction:column;align-items:flex-end;padding:8px 14px;border-radius:10px;background:var(--surface-2);min-width:170px}
.ua b{font-size:20px}.ua small{font-size:12px;color:var(--ink-2)}
.ua.warn{background:var(--warn-soft)}.ua.warn b .num{color:var(--warn)}
.ua.bad{background:var(--bad-soft)}.ua.bad b .num{color:var(--bad)}
.ua.good{background:var(--good-soft)}.ua.good b .num{color:var(--good)}
.salary{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:28px;align-items:end}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:2px}
.split i{display:block;height:100%;transition:width .2s}
.split-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2);align-items:center}
.split-legend span{display:inline-flex;align-items:center;gap:6px}
.split-legend em{width:8px;height:8px;border-radius:2px;background:var(--c);display:inline-block}
.split-legend b{color:var(--ink);font-weight:600}
.tools-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:7px;font-size:13px;color:var(--ink-2)}
.seg button:hover{background:var(--surface);color:var(--ink)}
.bhead,.brow-main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.6fr) repeat(3,minmax(0,.85fr)) 72px;gap:14px;align-items:center}
.bn .num small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3)}
.bn .num small.neg{color:var(--bad)}
.bhead{font-size:12px;color:var(--ink-3);padding:0 4px 10px;border-bottom:1px solid var(--line)}
.bhead span:nth-child(n+3){text-align:end}
.brow{border-bottom:1px solid var(--line);padding:12px 4px}
.brow:last-child{border-bottom:0}
.bpct{display:flex;align-items:center;gap:10px}
.bpct input{flex:1;min-width:0}
.bpct .pv{min-width:40px;text-align:end;font-weight:600;font-variant-numeric:tabular-nums}
.bn{text-align:end}
.ml{display:none}
.bact{display:flex;gap:2px;justify-content:flex-end}
.ents{margin:10px 0 2px;background:var(--surface-2);border-radius:10px;padding:2px 12px}
.ent{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}
.ent .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ent .d{font-size:12px;color:var(--ink-3)}
.editbox{margin-top:12px;padding:14px;border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;gap:12px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches .sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);background:var(--c)}
.swatches .sw[aria-pressed="true"]{outline:2px solid var(--ink)}
.swatches .ibtn[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);outline:1px solid var(--ink-3)}
.addsec{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.addsec .field{flex:1;min-width:150px}

/* log */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.logrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.logrow .mid{flex:1;min-width:0}
.logrow .mid b{font-weight:500;display:block;overflow-wrap:anywhere}
.logrow .mid small{color:var(--ink-3);font-size:12.5px}
.chip-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex:none}
.chip-ic svg{width:16px;height:16px}
.plus{color:var(--good)}
.empty{text-align:center;padding:34px 16px;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:16px}

/* import */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:48px 20px;text-align:center;background:var(--surface);transition:background .2s,border-color .2s}
.drop.over{background:var(--brand-soft);border-color:var(--brand)}
.drop .ic{width:52px;height:52px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.drop .ic svg{width:26px;height:26px}
.drop h2{font-size:18px;margin-bottom:4px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.how div{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.how b{display:block;color:var(--ink);margin-bottom:4px;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sum .card{padding:14px 16px}
.sum .num{font-size:20px;display:block}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec-title h2{font-size:16px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--ink-2)}
tr.off td{opacity:.45}
td select{min-height:34px;padding:4px 8px;border-radius:8px}
td .t{max-width:260px;overflow-wrap:anywhere}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
.importbar{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:0 10px 30px -14px rgba(0,0,0,.3);margin-top:14px;z-index:20}

/* modal, toast */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .15s ease forwards}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:460px;max-height:calc(100% - 20px);overflow:auto;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:rise .2s cubic-bezier(.3,.8,.3,1)}
.modal h2{font-size:18px;margin-bottom:16px}
.modal form{display:flex;flex-direction:column;gap:14px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
#toasts{position:fixed;z-index:90;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:rise .25s cubic-bezier(.3,.8,.3,1);max-width:min(440px,100%);display:flex;gap:10px;align-items:center;border-inline-start:4px solid var(--ink-3)}
.toast.good{border-inline-start-color:var(--brand-mid)}.toast.bad{border-inline-start-color:var(--bad)}.toast.gold{border-inline-start-color:var(--gold)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}

@media (max-width:980px){.grid-a{grid-template-columns:1fr}.salary,.income,.remain{grid-template-columns:1fr}}
@media (max-width:760px){
  .sthead,.bhead{display:none}
  .srow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n r" "b b";row-gap:10px}
  .srow .sname{grid-area:n}.srow .barcell{grid-area:b}.srow .c-sp{display:none}.srow .c-rem{grid-area:r}
  .brow-main{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"n n a" "m m q" "x y z";row-gap:10px}
  .bname{grid-area:n}.bact{grid-area:a}.bamt{grid-area:m}.bnp{grid-area:q}.bn1{grid-area:x}.bn2{grid-area:y}.bn3{grid-area:z}
  .ua{align-items:flex-start;width:100%}
  .bn{text-align:start}.inp.amt{margin-inline-start:0;max-width:100%}
  .fixrow{grid-template-columns:minmax(0,1fr) 110px 36px}.ml{display:block;font-size:11.5px;color:var(--ink-3)}
}
@media (max-width:720px){
  .nav{display:none}
  .top{height:58px;gap:8px}
  .tabbar{display:flex;position:fixed;z-index:45;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tabbar button{flex-direction:column;gap:2px;font-size:11px;padding:5px 10px}
  .tabbar button[aria-current="page"]{color:var(--brand)}
  .fab{display:grid;place-items:center;position:fixed;z-index:40;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:14px;border:0;background:var(--brand);color:var(--brand-ink);box-shadow:0 10px 24px -8px rgba(0,0,0,.35)}
  .fab svg{width:24px;height:24px}
  .monthsw span{min-width:84px;font-size:13px}
  .monthsw .ibtn{width:30px}
  .page-h{margin:20px 0 16px}.page-h h1{font-size:22px}
  .page-h .btn.hide-m{display:none}
  .row2{grid-template-columns:1fr}
  .card{padding:16px}
  .app{padding-bottom:110px}
  #toasts{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .importbar{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ch-line.draw{stroke-dashoffset:0}.ch-area.draw{opacity:1}}

/* ===== v2 additions ===== */
:root{--ease:cubic-bezier(.22,.8,.24,1)}
kbd{font:600 11px/1 var(--f);padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--brand-ink) 18%,transparent);margin-inline-start:4px}
.row-sb{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row-c{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* sync pill */
.sync{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);white-space:nowrap;cursor:default}
.sync svg{width:15px;height:15px}
.sync.synced{color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.sync.saving svg,.sync.loading svg{animation:pulse 1s ease-in-out infinite}
.sync.error,.sync.offline{color:var(--warn)}
.sync.demo{color:var(--gold);background:var(--gold-soft);border-color:transparent}
@keyframes pulse{50%{opacity:.35}}

/* view entrance */
#view.enter>*{animation:rise2 .5s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}#view.enter>*:nth-child(4){animation-delay:.12s}
#view.enter>*:nth-child(5){animation-delay:.16s}#view.enter>*:nth-child(6){animation-delay:.2s}#view.enter>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise2{from{opacity:0;transform:translateY(10px)}}

/* cards get a gentle lift on hover where they are interactive */
.srow,.logrow,.ent,.qchip,.ch-opt{transition:background .15s,transform .15s,border-color .15s}
.logrow,.ent{cursor:pointer;border-radius:8px}
.logrow:hover,.ent:hover{background:var(--surface-2)}

/* hero */
.hero{position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--brand) 10%,transparent),transparent 60%),
  radial-gradient(80% 70% at 0% 100%,color-mix(in srgb,var(--gold) 7%,transparent),transparent 60%),var(--surface)}
.hero-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.hero .big{font-size:clamp(36px,5vw,52px)}
.delta svg{width:13px;height:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg-line{width:14px!important;height:3px!important;background:var(--brand)}
.lg-dash{width:14px!important;height:0!important;border-top:2px dashed var(--ink-3);border-radius:0!important}
.ch-cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3;opacity:0;transition:opacity .15s}
.ch-cross.on{opacity:1}
.pace u em{position:absolute;top:12px;inset-inline-start:50%;transform:translateX(50%);font-style:normal;font-size:10.5px;color:var(--ink-2);white-space:nowrap;background:var(--surface);padding:0 4px;border-radius:4px}

/* quick add */
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 16px}
.quick .label{display:inline-flex;align-items:center;gap:5px;margin-inline-end:4px}
.quick .label svg{width:14px;height:14px;color:var(--gold)}
.qchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
.qchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.qchip b{color:var(--ink-2);font-weight:600}
.qchip:hover{border-color:var(--c);transform:translateY(-1px)}
.qchip:active{transform:scale(.96)}
.quick.in-modal{margin:0 0 14px}

/* notices */
.notice{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-color:color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn-soft) 55%,var(--surface))}
.notice-i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.notice-i svg{width:20px;height:20px}
.inline-form{display:flex;gap:8px}
.inline-form .inp{width:150px}
.banner .tag.warn{background:var(--warn-soft);color:var(--warn)}

/* salary flow */
.flowwrap{overflow-x:auto;direction:ltr;margin-inline:-4px}
.flowwrap svg{display:block;max-width:none;margin-inline:auto}
.fl .rb{opacity:.22;transition:opacity .2s;animation:flowin .9s var(--ease) both;animation-delay:var(--d);transform-origin:right center}
.fl:hover .rb{opacity:.5}
.fl:hover .fl-n{font-weight:700}
.flowwrap svg:hover .fl:not(:hover) .rb{opacity:.1}
.fl-n{fill:var(--ink);font:500 13px var(--f)}
.fl-v{fill:var(--ink-3);font:400 11.5px var(--f)}
@keyframes flowin{from{opacity:0;transform:scaleX(.2)}}

/* goals jar */
.jar{position:relative;width:112px;height:112px;flex:none}
.jar svg{width:100%;height:100%}
.jl{transform:translateY(var(--lvl));transition:transform 1.6s var(--ease)}
.jar .w1{animation:wave 4s linear infinite}
.jar .w2{animation:wave 2.8s linear infinite reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(60px)}}
.jt{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--ink);text-shadow:0 1px 0 var(--surface)}
.goal-top{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.gname{display:block;font-size:16px;font-weight:600;margin:2px 0}
.goal-row{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.gi{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--gold-soft);color:var(--gold);font-size:11.5px;font-weight:700;margin-inline-end:8px;flex:none}
.sim{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sim p{margin-top:4px}

/* loans */
.loan{padding:12px 0;border-top:1px solid var(--line)}
.loan:first-of-type{border-top:0;padding-top:0}
.fixblock{display:flex;flex-direction:column;gap:6px}
.fixrow{grid-template-columns:minmax(0,1fr) 120px 40px 40px!important}
.ibtn.on{background:var(--brand-soft);color:var(--brand)}
.loanmini{display:flex;align-items:center;gap:6px;padding-inline-start:4px}
.loanmini svg{width:14px;height:14px}
.loanbox{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.extras{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.extras summary{cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);list-style:none}
.extras summary::-webkit-details-marker{display:none}
.extras summary svg{width:17px;height:17px;color:var(--brand)}
.extras[open] summary{margin-bottom:10px;color:var(--ink)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 170px 40px;gap:8px;align-items:center}
.recrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 170px 100px 40px;gap:8px;align-items:center}

/* streak + badges */
.streak-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-size:12.5px;font-weight:600}
.streak-chip svg{width:14px;height:14px}
.bd{transition:transform .2s}
.bd:not(.lock):hover{transform:translateY(-2px)}

/* reports */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:16px}
.kpi b{font-size:22px;font-weight:600}
.rbar rect{animation:grow .7s var(--ease) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
.cmprow{display:grid;grid-template-columns:minmax(0,1.4fr) auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cmprow:first-child{border-top:0}
.cmprow .sname b{font-weight:500}
.pill svg{width:12px;height:12px}
.place{padding:8px 0;display:flex;flex-direction:column;gap:6px}
.rates{display:flex;gap:10px;align-items:flex-end;justify-content:space-around;flex-wrap:wrap}
.rate{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
.rtrack{position:relative;width:34px;height:120px;border-radius:8px;background:var(--surface-2);overflow:hidden;display:flex;align-items:flex-end}
.rtrack i{display:block;width:100%;height:0;border-radius:8px 8px 0 0;transition:height 1s var(--ease)}
.rtrack i.ok{background:var(--good)}.rtrack i.mid{background:var(--warn)}.rtrack i.low{background:var(--bad)}
.rgoal{position:absolute;inset-inline:0;bottom:40%;border-top:2px dashed var(--ink-3);z-index:1}

/* log groups */
.lgroup+.lgroup{margin-top:8px}
.lday{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:8px 4px;border-bottom:1px solid var(--line)}
.lday span:first-child{flex:1}

/* modals */
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh h2{margin:0}
.amtbig{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:6px 0 2px;border-bottom:2px solid var(--line);transition:border-color .2s}
.amtbig:focus-within{border-color:var(--brand)}
.amtbig .inp{border:0;box-shadow:none!important;font-size:40px;text-align:center;max-width:240px;background:transparent;padding:0;min-height:56px}
.amtbig .cur{font-size:16px}
.secpick{display:flex;flex-wrap:wrap;gap:6px}
.secpick label{cursor:pointer}
.secpick input{position:absolute;opacity:0;pointer-events:none}
.secpick span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink-2);transition:all .15s}
.secpick span svg{width:15px;height:15px;color:var(--c)}
.secpick input:checked+span{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:var(--c);color:var(--ink);font-weight:600}
.secpick input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.danger-t{color:var(--bad)!important}
.setsec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.glist{display:flex;flex-direction:column;gap:8px}
.grow-e{display:grid;grid-template-columns:24px minmax(0,1fr) 120px 36px 36px;gap:8px;align-items:center}
.review{text-align:center}
.review h2{font-size:24px;margin:4px 0 14px}
.rv-big{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px;border-radius:14px;background:var(--brand-soft);margin-bottom:12px}
.rv-big b{font-size:36px;font-weight:700}
.review .rows{text-align:start}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:center}
.ch-opt svg{width:22px;height:22px;color:var(--brand)}
.ch-opt b{font-size:14.5px}.ch-opt small{font-size:12px;color:var(--ink-2)}
.ch-opt:hover{border-color:var(--brand);transform:translateY(-2px)}

/* toasts with actions */
.toast{pointer-events:auto}
.toast.warn{border-inline-start-color:var(--warn)}
.tbtn{border:0;background:transparent;color:var(--brand-mid);font-weight:700;padding:2px 6px;border-radius:6px;margin-inline-start:4px}
.tbtn:hover{background:rgba(255,255,255,.08)}

/* welcome art */
.w-art{max-width:260px;margin:0 0 6px;margin-inline-start:auto}
.w-art svg{width:100%;height:auto;direction:ltr}
.w-art path{animation:flowin 1.2s var(--ease) both;transform-origin:right center}

@media (max-width:980px){.grid-b{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .exrow{grid-template-columns:minmax(0,1fr) 100px;}.exrow select{grid-column:1}.exrow .ibtn{grid-column:2;justify-self:end}
  .recrow{grid-template-columns:minmax(0,1fr) 96px}.recrow select{grid-column:auto}
  .fixrow{grid-template-columns:minmax(0,1fr) 96px 36px 36px!important}
  .choice{grid-template-columns:1fr}
  .cmprow{grid-template-columns:minmax(0,1fr) auto auto}.cmprow .small{display:none}
  .grow-e{grid-template-columns:22px minmax(0,1fr) 92px 34px 34px}
  .sync span{display:none}.sync{padding:0 8px}
}
@media (max-width:720px){
  .ov:has(.sheet){place-items:end center;padding:0}
  .modal.sheet{border-radius:20px 20px 0 0;max-height:92%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));animation:sheet .3s var(--ease)}
  @keyframes sheet{from{transform:translateY(100%)}}
  .quick{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .qchip{flex:none}
  .inline-form{width:100%}.inline-form .inp{flex:1;width:auto}
}

.pace{margin-bottom:22px!important}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
</style>

      <span>ترتيب</span>

        <span id="mLabel"></span>
        <button class="ibtn" data-act="month-next" aria-label="الشهر التالي" id="mNext"></button>
      </div>

/* ---------- pay cycles ----------
   A month key "YYYY-MM" names the cycle that starts on payday of that calendar month.
   With payday 1 a cycle is the calendar month. */
const keyOf=(y,m)=>y+'-'+pad(m);
const parseKey=k=>{const a=k.split('-').map(Number);return{y:a[0],m:a[1]}};
const shiftKey=(k,d)=>{const p=parseKey(k);const t=p.y*12+(p.m-1)+d;return keyOf(Math.floor(t/12),t%12+1)};
const monthName=k=>MONTHS[parseKey(k).m-1];
const monthLong=k=>monthName(k)+' '+parseKey(k).y;
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>isoOf(new Date());
const DAY=86400000;
function payday(){return Math.min(28,Math.max(1,(S&&S.payday)||1))}
function cycleStart(k){const p=parseKey(k);return new Date(p.y,p.m-1,payday())}
function cycleEnd(k){const d=cycleStart(shiftKey(k,1));d.setDate(d.getDate()-1);return d}
function cycleKeyOf(y,m,d){return d>=payday()?keyOf(y,m):shiftKey(keyOf(y,m),-1)}
function cycleKeyOfIso(s){const a=s.split('-').map(Number);return cycleKeyOf(a[0],a[1],a[2])}
function nowKey(){const d=new Date();return cycleKeyOf(d.getFullYear(),d.getMonth()+1,d.getDate())}
function daysIn(k){return Math.round((cycleEnd(k)-cycleStart(k))/DAY)+1}
function dayIndex(k){const t=new Date();t.setHours(12);const s=cycleStart(k);s.setHours(0);return Math.max(1,Math.min(daysIn(k),Math.floor((t-s)/DAY)+1))}
function cycleRange(k){const a=cycleStart(k),b=cycleEnd(k);return `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`}
function cycleDate(k,day){ // the date inside cycle k that falls on day-of-month `day`
  const p=parseKey(k),P=payday();let y=p.y,m=p.m;if(day<P){m++;if(m>12){m=1;y++}}
  const last=new Date(y,m,0).getDate();return y+'-'+pad(m)+'-'+pad(Math.min(day,last));
}
function cyclesBetween(a,b){const A=parseKey(a),B=parseKey(b);return (B.y-A.y)*12+(B.m-A.m)}
const fmtDate=iso=>{const a=iso.split('-').map(Number);return a[2]+' '+MONTHS[a[1]-1]};

const fresh=blank;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demo(){
  const st=blank();st.demo=true;st.opening=3000;st.payday=1;
  st.goals=[{id:'g1',name:'صندوق طوارئ',target:15000,icon:'shield'},{id:'g2',name:'سيارة جديدة',target:45000,icon:'car'}];
  const prevS=S;S=st;
  const cur=nowKey(),r=rng(2026),today=todayStr();
  const living=['بقالة الأسبوع','بنزين','مطعم الغداء','صيدلية','مواصلات','سوبرماركت','خضار وفواكه','غسيل سيارة'];
  const fun=['كافيه','سينما','طلب توصيل','تسوق ملابس','هدية','ألعاب','طلعة مع الأصدقاء'];
  const ratios=[[1.0,1.12],[.93,.78],[.88,.7],[.95,.86],[.9,.74],[.86,.8]];
  st.recurring=[{id:'r1',sec:'fun',title:'اشتراك نتفلكس',amount:56,day:9,since:shiftKey(cur,-5)}];
  for(let i=5;i>=0;i--){
    const key=shiftKey(cur,-i),salary=i>=2?12000:12500,base=salary-1800;
    const m={salary,fixed:[{id:uid(),lid:'L1',name:'قسط السيارة',amount:1800,loan:{balance:64800+1800*5,since:shiftKey(cur,-5),total:86400}}],extras:[],alloc:{bills:Math.round(base*.4),living:Math.round(base*.2),fun:Math.round(base*.15),save:Math.round(base*.2),emerg:Math.round(base*.05)},carry:{},entries:[],reviewed:true,closeChoice:'save'};
    if(i===2)m.extras.push({id:uid(),title:'مكافأة أداء',amount:1500,dest:'save'});
    const push=(sec,title,amount,day)=>{const d=cycleDate(key,day);if(d>today)return;m.entries.push({id:uid(),sec,title,amount:Math.round(amount),date:d})};
    const bills=m.alloc.bills;
    push('bills','إيجار الشقة',Math.round(bills*.72/50)*50,1);push('bills','فاتورة الكهرباء',250+Math.round(r()*160),9);
    push('bills','إنترنت المنزل',199,5);push('bills','باقة الجوال',150,6);push('bills','فاتورة المياه',90+Math.round(r()*40),3);
    [['living',living,m.alloc.living*ratios[5-i][0]],['fun',fun,(m.alloc.fun-56)*ratios[5-i][1]]].forEach(([sec,pool,total])=>{
      const n=sec==='living'?7:5,w=Array.from({length:n},()=>.4+r()),ws=w.reduce((a,b)=>a+b,0);
      w.forEach((x,j)=>push(sec,pool[(j+Math.floor(r()*3))%pool.length],total*x/ws,2+Math.floor(r()*26)));
    });
    m.entries.push({id:uid(),sec:'fun',title:'اشتراك نتفلكس',amount:56,date:cycleDate(key,9),rec:'r1'});
    if(i===1)push('save','إيداع إضافي',500,18);
    st.months[key]=m;
  }
  S=prevS;return st;
}
function migrate(o){
  if(!o||!o.sections||!o.months)return null;
  if(o.v===1){
    o.v=2;o.payday=1;o.recurring=o.recurring||[];
    o.goals=o.goal?[{id:'g1',name:o.goal.name,target:o.goal.target,icon:'target'}]:[{id:'g1',name:'هدفي الأول',target:20000,icon:'target'}];delete o.goal;
    Object.values(o.months).forEach(m=>{m.fixed=m.fixed||[];m.fixed.forEach(f=>f.lid=f.lid||f.id);m.extras=m.extras||[];m.carry=m.carry||{};m.reviewed=true});
  }
  o.updated=o.updated||0;return o;
}
function loadLocal(){try{const t=localStorage.getItem(STORE);if(t)return migrate(JSON.parse(t))}catch(e){}return null}

/* ---------- months ---------- */
function loanLeft(f,k){if(!f.loan)return null;return Math.max(0,f.loan.balance-f.amount*cyclesBetween(f.loan.since,k))}
function ensureMonth(key){
  if(S.months[key])return S.months[key];
  const keys=Object.keys(S.months).sort();let ref=null;
  for(const k of keys){if(k<key)ref=k}
  if(!ref&&keys.length)ref=keys[0];
  const alloc={};if(ref)calc(ref).secs.forEach(x=>alloc[x.sec.id]=Math.round(x.alloc0));
  const fixed=ref?(S.months[ref].fixed||[]).filter(f=>!f.loan||loanLeft(f,ref)>0||ref>key).map(f=>({id:uid(),lid:f.lid||f.id,name:f.name,amount:f.amount,loan:f.loan?{...f.loan}:null})):[];
  const m={salary:ref?S.months[ref].salary:0,fixed,extras:[],alloc,carry:{},entries:[]};
  S.months[key]=m;applyRecurring(key,m);return m;
}
function applyRecurring(key,m){
  (S.recurring||[]).forEach(r=>{
    if(r.since>key||m.entries.some(e=>e.rec===r.id))return;
    if(!S.sections.some(s=>s.id===r.sec))return;
    m.entries.push({id:uid(),sec:r.sec,title:r.title,amount:r.amount,date:cycleDate(key,r.day),rec:r.id});
  });
}
/* cycles skipped while the app was closed: create them and assume spending followed the plan */
function fillGaps(){
  const keys=Object.keys(S.months).sort(),now=nowKey();if(!keys.length)return[];
  const last=keys.filter(k=>k<now).pop();if(!last)return[];
  const gaps=[];for(let k=shiftKey(last,1);k<now;k=shiftKey(k,1)){if(!S.months[k]){const m=ensureMonth(k);m.assumed=true;gaps.push(k)}}
  return gaps;
}
function moveEntriesToCycles(){ // after payday changes
  const all=[];Object.keys(S.months).forEach(k=>{S.months[k].entries.forEach(e=>all.push(e));S.months[k].entries=[]});
  all.forEach(e=>{const k=cycleKeyOfIso(e.date);ensureMonth(k);S.months[k].entries.push(e)});
}

/* ---------- calculations ---------- */
function calc(key){
  const m=S.months[key];if(!m)return null;
  const fixed=m.fixed||[],fixedTotal=fixed.reduce((a,f)=>a+(+f.amount||0),0),extras=m.extras||[];
  const exBase=extras.filter(x=>x.dest!=='save').reduce((a,x)=>a+(+x.amount||0),0),exSave=extras.filter(x=>x.dest==='save').reduce((a,x)=>a+(+x.amount||0),0);
  const base=Math.max(0,m.salary-fixedTotal+exBase);
  const spendEntries=m.entries.filter(e=>{const s=S.sections.find(x=>x.id===e.sec);return s&&s.kind!=='save'}).length;
  const assumed=!!m.assumed&&!spendEntries;
  const secs=S.sections.map(sec=>{
    const alloc0=m.alloc?(+m.alloc[sec.id]||0):base*(m.pcts&&m.pcts[sec.id]!=null?m.pcts[sec.id]:(sec.pct||0))/100;
    const carry=+((m.carry||{})[sec.id])||0,alloc=alloc0+carry,pct=base?alloc0/base*100:0;
    const entries=m.entries.filter(e=>e.sec===sec.id),sum=entries.reduce((a,e)=>a+e.amount,0);
    if(sec.kind==='save')return{sec,pct,alloc0,carry,alloc,entries,deposit:sum,saved:alloc+sum,spent:0,remaining:0};
    const spent=assumed?alloc:sum;
    return{sec,pct,alloc0,carry,alloc,entries,deposit:0,saved:0,spent,remaining:alloc-spent};
  });
  const spend=secs.filter(s=>s.sec.kind!=='save'),spendAlloc=spend.reduce((a,s)=>a+s.alloc,0),spent=spend.reduce((a,s)=>a+s.spent,0);
  const saveSum=secs.reduce((a,s)=>a+s.saved,0)+exSave,left=spendAlloc-spent,closed=key<nowKey();
  const counted=closed?(m.closeChoice==='carry'?saveSum+Math.min(0,left):saveSum+left):saveSum+Math.min(0,left);
  const projected=closed?0:Math.max(0,left);
  const allocTotal=secs.reduce((a,s)=>a+s.alloc0,0),income=m.salary+exBase+exSave;
  return{key,m,salary:m.salary,fixed,fixedTotal,extras,exBase,exSave,base,secs,spendAlloc,spent,saveSum,left,closed,counted,projected,assumed,
    rate:income?(counted+projected)/income:0,within:spent<=spendAlloc+0.5,allWithin:spend.every(s=>s.remaining>=-0.5),
    pctTotal:secs.reduce((a,s)=>a+s.pct,0),allocTotal,unalloc:base-allocTotal,income};
}
function timeline(){
  const keys=Object.keys(S.months).sort();let run=S.opening||0;
  return keys.map(k=>{const c=calc(k);run+=c.counted;return{key:k,net:c.counted,total:run,c}});
}
function avgNet(T){
  const closed=T.filter(p=>p.c.closed&&p.c.salary>0).slice(-3);
  if(closed.length)return closed.reduce((a,p)=>a+p.net,0)/closed.length;
  const last=T[T.length-1];return last?(last.c.counted+last.c.projected):0;
}
function avgSpendTotal(){const ks=Object.keys(S.months).filter(k=>k<nowKey()).sort().slice(-3);if(!ks.length)return 0;return ks.reduce((a,k)=>{const c=calc(k);return a+c.spent+c.fixedTotal},0)/ks.length}
function avgSpend(secId,key){
  const ks=Object.keys(S.months).filter(k=>k<key).sort().slice(-3);
  const vals=ks.map(k=>{const c=calc(k);if(c.assumed)return null;const s=c.secs.find(x=>x.sec.id===secId);return s?(s.sec.kind==='save'?s.deposit:s.spent):null}).filter(v=>v!=null);
  return vals.length?{v:vals.reduce((a,b)=>a+b,0)/vals.length,n:vals.length}:null;
}
function streak(T){let n=0;for(let i=T.length-1;i>=0;i--){const c=T[i].c;if(c.salary>0&&c.within)n++;else break}return n}
function totalSaved(T){return T.length?T[T.length-1].total:(S.opening||0)}
/* goals fill in priority order (a waterfall) */
function goalsState(T,extra){
  const total=Math.max(0,totalSaved(T)),monthly=avgNet(T)+(extra||0),last=T.length?T[T.length-1].key:nowKey();
  let before=0;
  return S.goals.map(g=>{
    const have=Math.max(0,Math.min(g.target,total-before)),cum=before+g.target;before=cum;
    const need=cum-total;let eta=null;
    if(need<=0)eta={done:true};else if(monthly>0){const n=Math.ceil(need/monthly);eta={n,key:shiftKey(last,n)}}
    return{g,have,p:g.target?have/g.target:0,eta,monthly};
  });
}
function loans(key){const m=S.months[key];if(!m)return[];return(m.fixed||[]).filter(f=>f.loan).map(f=>{const left=loanLeft(f,key),n=Math.ceil(left/(f.amount||1)),tot=f.loan.total||f.loan.balance;return{f,left,n,end:shiftKey(key,n),total:tot,p:tot?Math.min(1,(tot-left)/tot):0}})}
function frequent(){
  const ks=Object.keys(S.months).sort().slice(-3),map={};
  ks.forEach(k=>S.months[k].entries.forEach(e=>{if(e.rec)return;const sec=S.sections.find(s=>s.id===e.sec);if(!sec||sec.kind==='save')return;const rk=ruleKey(e.title)+'|'+e.sec;(map[rk]=map[rk]||{title:e.title,sec:e.sec,n:0,amounts:[]});map[rk].n++;map[rk].amounts.push(e.amount)}));
  return Object.values(map).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,6).map(x=>({...x,amount:Math.round(x.amounts.slice(-3).reduce((a,b)=>a+b,0)/Math.min(3,x.amounts.length))}));
}
function badges(T){
  const total=totalSaved(T),st=streak(T),G=goalsState(T,0);
  const bestRate=Math.max(0,...T.filter(p=>p.c.closed).map(p=>p.c.income?p.c.counted/p.c.income:0));
  const emerg=T.reduce((a,p)=>{const s=p.c.secs.find(x=>x.sec.id==='emerg');return a+(s?s.saved:0)},0);
  const lastSal=T.length?T[T.length-1].c.salary:0,perfect=T.some(p=>p.c.salary>0&&p.c.allWithin&&p.c.closed&&!p.c.assumed);
  const B=(id,icon,title,desc,prog)=>({id,icon,title,desc,progress:Math.max(0,Math.min(1,prog)),unlocked:prog>=1});
  return[
    B('k5','coins','أول 5,000','أول 5,000 في مدخراتك',total/5000),
    B('k10','chart','عشرة آلاف','وصلت 10,000 مدخرات',total/10000),
    B('k25','trophy','نادي الـ 25 ألف','25,000 مدخرات كاملة',total/25000),
    B('st3','flame','3 أشهر منضبطة','3 أشهر متتالية داخل الميزانية',st/3),
    B('st6','flame','نصف سنة انضباط','6 أشهر متتالية داخل الميزانية',st/6),
    B('r25','star','ادخار 25%+','شهر ادخرت فيه ربع دخلك أو أكثر',bestRate/.25),
    B('em','shield','درع الطوارئ','جمعت راتب شهر كامل في الطوارئ',lastSal?emerg/lastSal:0),
    B('perfect','check','شهر مثالي','شهر كامل بدون تجاوز أي قسم',perfect?1:0),
    B('goal1','target','أول هدف','حققت هدفك الأول',G[0]?G[0].p:0)
  ];
}
function checkBadges(silent){
  const T=timeline(),bs=badges(T),have=new Set(S.unlocked||[]),nw=bs.filter(b=>b.unlocked&&!have.has(b.id));
  if(!nw.length)return;
  S.unlocked=[...have,...nw.map(b=>b.id)];saveLocal();cloudQueue();
  if(silent||S.demo)return;
  nw.forEach((b,i)=>setTimeout(()=>toast('إنجاز جديد: '+b.title,'gold',4200),500+i*700));

}

/* ---------- cloud sync (signed-in viewers keep a private copy on their account) ---------- */
const IN_CLAUDE=!!(window.claude&&window.claude.use);
const CLOUD={db:null,uid:null,on:false,status:'local',sent:{},busy:false,again:false,timer:null};
function cloudSetStatus(s){CLOUD.status=s;const el=document.getElementById('sync');if(el)el.outerHTML=syncPill()}
function splitState(){
  const profile={...S};delete profile.months;const out={profile};
  Object.keys(S.months).forEach(k=>out['m-'+k]=S.months[k]);return out;
}
function cloudQueue(){if(!CLOUD.on||S.demo)return;clearTimeout(CLOUD.timer);cloudSetStatus('saving');CLOUD.timer=setTimeout(cloudFlush,900)}
async function cloudFlush(){
  if(CLOUD.busy){CLOUD.again=true;return}
  CLOUD.busy=true;
  try{
    const docs=splitState(),col='data/users/'+CLOUD.uid;
    for(const id of Object.keys(docs)){const j=JSON.stringify(docs[id]);if(CLOUD.sent[id]===j)continue;await CLOUD.db.doc(col+'/'+id).set(JSON.parse(j));CLOUD.sent[id]=j}
    for(const id of Object.keys(CLOUD.sent)){if(!docs[id]){await CLOUD.db.doc(col+'/'+id).delete();delete CLOUD.sent[id]}}
    cloudSetStatus('synced');
  }catch(e){
    if(e&&e.code==='invalid_argument'){CLOUD.on=false;cloudSetStatus('readonly')}
    else if(e&&e.code==='quota_exceeded'){cloudSetStatus('error');toast('مساحة الحفظ السحابي ممتلئة. بياناتك محفوظة على هذا الجهاز.','bad',5000)}
    else cloudSetStatus('error');
  }
  CLOUD.busy=false;if(CLOUD.again){CLOUD.again=false;cloudFlush()}
}
async function cloudFetch(){
  const snap=await CLOUD.db.collection('data/users/'+CLOUD.uid).get(),docs={};
  snap.docs.forEach(d=>{if(d.exists)docs[d.id]=d.data()});return docs;
}
function fromDocs(docs){
  const st=JSON.parse(JSON.stringify(docs.profile));st.months={};
  Object.keys(docs).forEach(id=>{if(id.startsWith('m-'))st.months[id.slice(2)]=JSON.parse(JSON.stringify(docs[id]))});
  return migrate(st);
}
function hasRealData(){return !S.demo&&Object.values(S.months).some(m=>m.salary>0||m.entries.length)}
async function cloudInit(){
  if(!window.claude||!window.claude.use)return;
  let db,user;try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){return}
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  CLOUD.db=db;CLOUD.uid=id;cloudSetStatus('loading');
  const t=setTimeout(()=>{if(CLOUD.status==='loading')cloudSetStatus('offline')},10000);
  try{
    const docs=await cloudFetch();clearTimeout(t);
    Object.keys(docs).forEach(k=>CLOUD.sent[k]=JSON.stringify(docs[k]));
    CLOUD.on=true;
    if(docs.profile&&(docs.profile.updated||0)>=(S.updated||0)){S=fromDocs(docs);afterLoad();saveLocal();cloudSetStatus('synced');render();toast('تم تحميل بياناتك من حسابك','good')}
    else if(hasRealData()){cloudQueue()}
    else cloudSetStatus('synced');
  }catch(e){clearTimeout(t);cloudSetStatus(e&&e.code==='invalid_argument'?'readonly':'error')}
}
async function cloudRefresh(){
  if(!CLOUD.on||CLOUD.busy||CLOUD.status==='saving')return;
  try{const docs=await cloudFetch();if(docs.profile&&(docs.profile.updated||0)>(S.updated||0)){Object.keys(docs).forEach(k=>CLOUD.sent[k]=JSON.stringify(docs[k]));S=fromDocs(docs);afterLoad();saveLocal();render();toast('تم تحديث بياناتك من جهاز آخر')}}catch(e){}
}
function syncPill(){
  const st=CLOUD.status,map={

    synced:['cloud','محفوظ في حسابك','بياناتك محفوظة في حسابك وتتزامن بين أجهزتك. ما أحد غيرك يشوفها.'],
    offline:['cloudoff','بدون اتصال','ما قدرنا نوصل للحفظ السحابي. بياناتك محفوظة على هذا الجهاز.'],
    error:['cloudoff','تعذّر الحفظ السحابي','بياناتك محفوظة على هذا الجهاز، وبنحاول مرة ثانية مع التعديل الجاي.'],
    readonly:['device','محفوظ على هذا الجهاز','صلاحيتك على الرابط لا تسمح بالحفظ السحابي، فبياناتك محفوظة في هذا المتصفح.']

}

/* ---------- status ---------- */
function usage(s){return s.alloc?s.spent/s.alloc:0}
function statusOf(s){
  if(s.sec.kind==='save')return{cls:'good',txt:'مجنّب'};
  if(!s.alloc)return{cls:'',txt:'—'};
  const r=usage(s);return r>1?{cls:'bad',txt:'تجاوز'}:r>=.85?{cls:'warn',txt:'قارب الحد'}:{cls:'good',txt:'ضمن الخطة'};
}
function barCls(s){if(s.sec.kind==='save'||!s.alloc)return'';const r=usage(s);return r>1?'bad':r>=.85?'warn':''}
function statusLine(c){
  if(!c.salary)return{cls:'neutral',text:'أدخل راتبك من صفحة الميزانية لبدء التوزيع.'};
  if(c.base>0&&c.allocTotal<1)return{cls:'neutral',text:`باقي من راتبك ${mtxt(c.base)}. وزّعه على أقسامك من صفحة الميزانية.`};
  if(c.assumed)return{cls:'warn',text:'ما سجلت مصاريف لهذا الشهر، فافترضنا إنك صرفت حسب خطتك.'};
  if(c.closed){const r=Math.round(c.rate*100);return c.left<0?{cls:'bad',text:`تجاوزت ميزانية الصرف في ${monthName(c.key)} بمقدار ${mtxt(-c.left)}.`}:{cls:r>=20?'good':'warn',text:`أُغلق شهر ${monthName(c.key)} بمعدل ادخار ${r}%.`}}
  const tf=dayIndex(c.key)/daysIn(c.key),sf=c.spendAlloc?c.spent/c.spendAlloc:0,P=x=>Math.round(x*100);
  if(c.left<0)return{cls:'bad',text:`تجاوزت ميزانية الصرف بمقدار ${mtxt(-c.left)}، والفرق يُخصم من مدخراتك.`};
  if(c.spent===0)return{cls:'neutral',text:'لا توجد مصروفات مسجّلة هذا الشهر بعد.'};
  if(sf<=tf)return{cls:'good',text:`صرفك ضمن الخطة: ${P(sf)}% من الميزانية مع مرور ${P(tf)}% من الشهر.`};
  if(sf<=tf+.1)return{cls:'warn',text:`صرفك قريب من الحد: ${P(sf)}% من الميزانية مع مرور ${P(tf)}% من الشهر.`};
  return{cls:'bad',text:`صرفك أسرع من المخطط: ${P(sf)}% من الميزانية مع مرور ${P(tf)}% فقط من الشهر.`};
}

/* ---------- flow (salary → commitments and sections) ---------- */
let flowData=null;
function flowSVG(c){
  const items=[];
  c.fixed.forEach(f=>items.push({name:f.name,v:+f.amount||0,color:'var(--ink-3)',kind:'fixed'}));
  c.secs.forEach(s=>{if(s.alloc0>0)items.push({name:s.sec.name,v:s.alloc0,color:s.sec.color,kind:s.sec.kind,used:s.sec.kind==='save'?1:Math.min(1,s.alloc?s.spent/s.alloc:0),id:s.sec.id})});
  if(c.exSave)items.push({name:'دخل إضافي للمدخرات',v:c.exSave,color:'var(--brand)',kind:'save',used:1});
  if(c.unalloc>1)items.push({name:'غير موزّع',v:c.unalloc,color:'var(--line)',kind:'un'});
  if(!items.length)return'';
  const wrapW=Math.max(320,Math.min(1100,(($('#view')||{}).clientWidth||900)-42)),W=wrapW,narrow=W<560;
  const total=Math.max(c.income,items.reduce((a,x)=>a+x.v,0)),BAR=narrow?200:250,k=BAR/total;
  let y=0;const lay=items.map(it=>{const h=Math.max(4,it.v*k),slot=Math.max(h+10,narrow?40:44),o={...it,h,y:y+(slot-h)/2};y+=slot;return o});
  const H=Math.max(y,BAR+30),sx=W-18,tx=narrow?Math.round(W*.46):Math.max(190,Math.round(W*.22)),sy0=(H-c.income*k)/2;
  let sy=sy0,svg='';
  lay.forEach((it,i)=>{
    const sh=it.v*k,ys0=sy,s1=sy+sh,xm=(sx+tx+14)/2;sy+=sh;
    const yt0=it.y,yt1=it.y+it.h;
    svg+=`<g class="fl" data-i="${i}" style="--d:${i*70}ms"><path class="rb" d="M${sx} ${ys0} C${xm} ${ys0},${xm} ${yt0},${tx+14} ${yt0} L${tx+14} ${yt1} C${xm} ${yt1},${xm} ${s1},${sx} ${s1}Z" fill="${it.color}"/>
      <rect x="${tx}" y="${yt0}" width="14" height="${it.h}" rx="3" fill="${it.color}" opacity="${it.kind==='un'?1:.4}"/>
      ${it.used!=null&&it.kind!=='un'?`<rect x="${tx}" y="${yt1-it.h*it.used}" width="14" height="${it.h*it.used}" rx="3" fill="${it.color}"/>`:''}
      <text class="fl-n" x="${tx-10}" y="${(yt0+yt1)/2-2}" text-anchor="end">${esc(it.name)}</text>
      <text class="fl-v" x="${tx-10}" y="${(yt0+yt1)/2+14}" text-anchor="end">${fmt(it.v)} · ${Math.round(it.v/c.income*100)}%</text></g>`;
  });
  flowData={lay,c};
  return `<svg viewBox="0 0 ${W} ${H+28}" width="${W}" height="${H+28}" role="img" aria-label="توزيع الراتب"><g transform="translate(0,22)">
    <rect x="${sx}" y="${sy0}" width="18" height="${c.income*k}" rx="4" fill="var(--brand)"/>
    <text class="fl-n" x="${sx+18}" y="${sy0-10}" text-anchor="end">الدخل ${fmt(c.income)}</text>${svg}</g></svg>`;
}

/* ---------- savings chart ---------- */
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m))),r=m/p;for(const s of [1,1.5,2,2.5,3,4,5,6,8,10])if(s>=r*1.04)return s*p;return 10*p}
const kfmt=n=>n>=1000?(n/1000).toFixed(n%1000?1:0).replace(/\.0$/,'')+'k':String(Math.round(n));
function smooth(pts){
  if(pts.length<2)return'';let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2,t=.18;d+=` C${p1[0]+(p2[0]-p0[0])*t},${p1[1]+(p2[1]-p0[1])*t} ${p2[0]-(p3[0]-p1[0])*t},${p2[1]-(p3[1]-p1[1])*t} ${p2[0]},${p2[1]}`}
  return d;
}
let chartData=null;
function chartSVG(series,sel,projTotal){
  const W=720,H=230,L=40,R=16,Tp=12,B=28,vals=series.map(p=>p.total),n=series.length+(projTotal!=null?1:0);
  if(!series.length)return'';
  const max=niceMax(Math.max(...vals,projTotal||0,1));
  const x=i=>n===1?(L+(W-L-R)/2):L+(W-L-R)*i/(n-1),y=v=>Tp+(H-Tp-B)*(1-Math.max(0,v)/max);
  const pts=series.map((p,i)=>[x(i),y(p.total)]),line=smooth(pts),area=pts.length>1?line+` L${pts[pts.length-1][0]},${H-B} L${pts[0][0]},${H-B} Z`:'';
  let grid='';for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);grid+=`<line class="ch-grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ch-txt" x="${L-8}" y="${yy+4}" text-anchor="end">${kfmt(v)}</text>`}
  const xl=series.map((p,i)=>`<text class="ch-txt" x="${x(i)}" y="${H-6}" text-anchor="middle" ${i===sel?'style="fill:var(--ink);font-weight:600"':''}>${monthName(p.key)}</text>`).join('');
  const dr=UI.animate?' draw':'';let projEl='';
  if(projTotal!=null){const last=pts[pts.length-1],px=x(n-1),py=y(projTotal);projEl=`<path class="ch-proj" d="M${last[0]},${last[1]} L${px},${py}"/><circle cx="${px}" cy="${py}" r="4" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="2"/><text class="ch-txt" x="${px}" y="${H-6}" text-anchor="middle">متوقع</text>`}
  const dots=pts.map((p,i)=>`<circle class="ch-dot ${i===sel?'sel':''}" cx="${p[0]}" cy="${p[1]}" r="${i===sel?5.5:3.5}"/>`).join('');
  chartData={pts,series,W,H};
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="نمو المدخرات شهرياً"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".22"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
   ${grid}${xl}<path class="ch-area${dr}" d="${area}" fill="url(#ga)"/><path class="ch-line${dr}" pathLength="1" d="${line}"/>${projEl}<line class="ch-cross" id="cross" x1="0" x2="0" y1="${Tp}" y2="${H-B}"/>${dots}<rect class="ch-hit" x="0" y="0" width="${W}" height="${H}"/></svg>`;
}
function bindChart(){
  const wrap=$('#chart');if(!wrap||!chartData)return;
  const svg=$('svg',wrap),tip=$('#tip'),cd=chartData,cross=$('#cross');
  const move=e=>{
    const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*cd.W;
    let bi=0,bd=1e9;cd.pts.forEach((p,i)=>{const d=Math.abs(p[0]-sx);if(d<bd){bd=d;bi=i}});
    const p=cd.series[bi],pt=cd.pts[bi];
    tip.innerHTML=`<b>${monthLong(p.key)}</b><br>المدخرات: <span class="num">${fmt(p.total)}</span> ${cur()}<br><span class="muted">صافي الشهر: <span class="num">${p.net>=0?'+':'−'}${fmt(Math.abs(p.net))}</span></span>`;
    tip.style.left=(pt[0]/cd.W*r.width)+'px';tip.style.top=(pt[1]/cd.H*r.height)+'px';tip.classList.add('on');
    cross.setAttribute('x1',pt[0]);cross.setAttribute('x2',pt[0]);cross.classList.add('on');
  };
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{tip.classList.remove('on');cross.classList.remove('on')});
}

/* ---------- reports ---------- */
function viewReports(){
  const ks=Object.keys(S.months).sort().filter(k=>k<=UI.month).slice(-6),C=ks.map(calc);
  if(!C.some(c=>c.spent||c.salary))return `<div class="page-h"><div><h1>التقارير</h1></div></div><div class="card empty"><h3>ما فيه بيانات كافية</h3><p>سجّل راتبك ومصاريفك وتطلع لك التقارير هنا.</p></div>`;
  const spends=S.sections.filter(s=>s.kind!=='save');
  const real=C.filter(c=>!c.assumed),avgSp=real.length?real.reduce((a,c)=>a+c.spent+c.fixedTotal,0)/real.length:0;
  const closed=C.filter(c=>c.closed&&c.income),avgRate=closed.length?closed.reduce((a,c)=>a+c.counted/c.income,0)/closed.length:0;
  const best=closed.slice().sort((a,b)=>b.counted-a.counted)[0];
  // stacked spend bars
  const W=720,H=240,L=44,B=28,Tp=10,bw=Math.min(64,(W-L-20)/ks.length*.55);
  const tots=C.map(c=>c.fixedTotal+spends.reduce((a,s)=>a+(c.secs.find(x=>x.sec.id===s.id)||{spent:0}).spent,0));
  const max=niceMax(Math.max(...tots,...C.map(c=>c.income),1)),y=v=>Tp+(H-Tp-B)*(1-v/max),xc=i=>L+(W-L-20)*(i+.5)/ks.length;
  let bars='',grid='';for(let k=0;k<=4;k++){const v=max*k/4;grid+=`<line class="ch-grid" x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-txt" x="${L-8}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`}
  C.forEach((c,i)=>{let acc=0;const seg=(v,col,name)=>{if(v<=0)return'';const y0=y(acc+v),h=y(acc)-y0;acc+=v;return `<rect x="${xc(i)-bw/2}" y="${y0}" width="${bw}" height="${Math.max(0,h-1)}" fill="${col}" rx="2"><title>${esc(name)}: ${fmt(v)}</title></rect>`};
    bars+=`<g class="rbar" style="--d:${i*80}ms">${seg(c.fixedTotal,'var(--ink-3)','التزامات')}${spends.map(s=>{const x=c.secs.find(q=>q.sec.id===s.id);return seg(x?x.spent:0,s.color,s.name)}).join('')}</g>`;
    bars+=`<line x1="${xc(i)-bw/2-6}" x2="${xc(i)+bw/2+6}" y1="${y(c.income)}" y2="${y(c.income)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4"><title>الدخل ${fmt(c.income)}</title></line>`;
    bars+=`<text class="ch-txt" x="${xc(i)}" y="${H-8}" text-anchor="middle" ${c.key===UI.month?'style="fill:var(--ink);font-weight:600"':''}>${monthName(c.key)}${c.assumed?'*':''}</text>`});
  // this month vs average
  const cm=calc(UI.month),cmp=spends.map(s=>{const a=avgSpend(s.id,UI.month),x=cm.secs.find(q=>q.sec.id===s.id);return{s,now:x?x.spent:0,avg:a?a.v:null}});
  // top places
  const pl={};ks.forEach(k=>S.months[k].entries.forEach(e=>{const s=secOf(e.sec);if(!s||s.kind==='save')return;const rk=ruleKey(e.title)||e.title;(pl[rk]=pl[rk]||{t:e.title,v:0,n:0,c:s.color});pl[rk].v+=e.amount;pl[rk].n++}));
  const top=Object.values(pl).sort((a,b)=>b.v-a.v).slice(0,8),tmax=top.length?top[0].v:1;
  // savings rate bars
  const rates=C.map(c=>({k:c.key,r:c.income?(c.counted+c.projected)/c.income:0,closed:c.closed}));
  return `<div class="page-h"><div><span class="eyebrow">آخر ${ks.length} ${plural(ks.length,'شهر','أشهر','شهر')}</span><h1>التقارير</h1><p class="status neutral"><i></i>صورة واضحة لصرفك وادخارك عبر الأشهر.</p></div><button class="btn ghost" data-act="export">${ic('download')}تصدير Excel</button></div>
  <div class="kpis">
    <div class="card kpi"><span class="label">متوسط صرفك الشهري</span><b>${money(avgSp)}</b><small class="small">مع الالتزامات</small></div>
    <div class="card kpi"><span class="label">متوسط معدل الادخار</span><b><span class="num">${Math.round(avgRate*100)}%</span></b><small class="small">للأشهر المكتملة</small></div>
    <div class="card kpi"><span class="label">أفضل شهر</span><b>${best?monthName(best.key):'—'}</b><small class="small">${best?'ادخرت '+mtxt(best.counted):''}</small></div>
    <div class="card kpi"><span class="label">إجمالي المدخرات</span><b>${money(totalSaved(timeline()))}</b><small class="small">حتى الآن</small></div>
  </div>
  <section class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>الصرف الشهري حسب القسم</h2><p class="small">الخط المتقطع هو دخل الشهر.${C.some(c=>c.assumed)?' * شهر مُفترض.':''}</p></div><div class="legend small">${spends.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}<span><i style="background:var(--ink-3)"></i>التزامات</span></div></div>
    <div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الصرف الشهري">${grid}${bars}</svg></div></section>
  <div class="grid-b">
    <section class="card"><div class="card-h"><h2>${monthName(UI.month)} مقابل متوسطك</h2></div>
      <div class="cmp">${cmp.map(x=>{const d=x.avg?((x.now-x.avg)/x.avg):null;return `<div class="cmprow" style="--c:${x.s.color}"><span class="sname"><span class="dotic">${ic(x.s.icon)}</span><b>${esc(x.s.name)}</b></span><span class="num">${fmt(x.now)}</span><span class="small">متوسط ${x.avg!=null?fmt(x.avg):'—'}</span>${d==null?'<span class="pill">جديد</span>':`<span class="pill ${d>.1?'bad':d<-.1?'good':''}">${ic(d>0?'arrowup':'arrowdown')}<span dir="ltr">${Math.abs(Math.round(d*100))}%</span></span>`}</div>`}).join('')}</div></section>
    <section class="card"><div class="card-h"><h2>أكثر الأماكن صرفاً</h2><span class="small">آخر ${ks.length} ${plural(ks.length,'شهر','أشهر','شهر')}</span></div>
      ${top.length?top.map(t=>`<div class="place"><div class="row-sb"><span>${esc(t.t)} <span class="small">· ${t.n} ${plural(t.n,'مرة','مرات','مرة')}</span></span>${money(t.v)}</div><span class="bar"><i data-w="${t.v/tmax*100}" style="background:${t.c}"></i></span></div>`).join(''):'<p class="small">ما فيه عمليات بعد.</p>'}</section>
  </div>
  <section class="card" style="margin-top:16px"><div class="card-h"><div><h2>معدل الادخار</h2><p class="small">الخط المتقطع يمثل هدف 20% من الدخل.</p></div></div>
    <div class="rates">${rates.map(r=>`<div class="rate"><div class="rtrack"><span class="rgoal"></span><i data-h="${Math.max(0,Math.min(100,r.r*200))}" class="${r.r>=.2?'ok':r.r>0?'mid':'low'}"></i></div><b class="num">${Math.round(r.r*100)}%</b><span class="small">${monthName(r.k)}${r.closed?'':' (جارٍ)'}</span></div>`).join('')}</div></section>`;
}

  const txt=nz(title+' '+catText);

      if(typ&&hasW(typ,INCOME_W)&&!hasW(typ,EXPENSE_W))kind='income';
      else if(typ&&hasW(typ,EXPENSE_W))kind='expense';
      else if(signed)kind=n>0?'income':'expense';
      else if(hasW(nt,SALARY_W)&&!hasW(nt,['خصم','سلفه']))kind='income';
    }
    if(!amt)return;
    if(!date&&!title&&!amt)return;
    const row={id:uid(),include:true,date,title:title||cat||'بدون وصف',amount:amt,kind,sec:null,conf:'none',act:'ignore',dup:false,manual:false};
    if(kind==='expense'){const cz=categorize(row.title,cat);row.sec=cz.sec;row.conf=cz.conf}
    rows.push(row);
  });
  // incomes: mark salary candidates
  const byM={};
  rows.filter(x=>x.kind==='income').forEach(x=>{const k=x.date?cycleKeyOf(x.date.y,x.date.m,x.date.d):defKey;(byM[k]=byM[k]||[]).push(x)});
  Object.values(byM).forEach(list=>{
    const sal=list.filter(x=>hasW(nz(x.title),SALARY_W));
    const pick=sal.length?sal:[list.slice().sort((a,b)=>b.amount-a.amount)[0]];
    pick.forEach(x=>x.act='salary');
    list.forEach(x=>{if(x.act!=='salary'){x.act='extra';x.include=false}});
  });
  // rows that match a fixed commitment (already deducted)
  rows.forEach(x=>{
    if(x.kind!=='expense')return;
    const k=x.date?cycleKeyOf(x.date.y,x.date.m,x.date.d):defKey,m=S.months[k]||S.months[nowKey()],fx=(m&&m.fixed)||[];
    if(fx.some(f=>Math.abs(f.amount-x.amount)<=1)){x.fixed=true;x.include=false}
  });
  // duplicates vs existing
  rows.forEach(x=>{
    if(x.kind!=='expense'||x.fixed)return;
    const k=x.date?cycleKeyOf(x.date.y,x.date.m,x.date.d):defKey,m=S.months[k];if(!m)return;
    const ds=x.date?x.date.y+'-'+pad(x.date.m)+'-'+pad(x.date.d):null;
    if(m.entries.some(e=>e.amount===Math.round(x.amount)&&nz(e.title)===nz(x.title)&&(!ds||e.date===ds))){x.dup=true;x.include=false}
  });
  return rows;
}

async function exportBackup(){
  if(typeof XLSX==='undefined'){toast('مكتبة Excel ما تحمّلت. تأكد من الاتصال.','bad');return}
  const wb=XLSX.utils.book_new(),T=timeline();
  const ent=[['التاريخ','البيان','القسم','المبلغ','الشهر']];
  Object.keys(S.months).sort().forEach(k=>S.months[k].entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const s=secOf(e.sec);ent.push([e.date,e.title,s?s.name:'',e.amount,monthLong(k)])}));
  const mon=[['الشهر','الراتب','الالتزامات','دخل إضافي','المصروف','المجنّب','مدخرات الشهر','إجمالي المدخرات']];
  T.forEach(p=>mon.push([monthLong(p.key),p.c.salary,p.c.fixedTotal,p.c.exBase+p.c.exSave,Math.round(p.c.spent),Math.round(p.c.saveSum),Math.round(p.net),Math.round(p.total)]));
  const j=JSON.stringify(S),chunks=[['tarteeb backup v2 — لا تعدّل هذي الورقة']];for(let i=0;i<j.length;i+=30000)chunks.push([j.slice(i,i+30000)]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ent),'العمليات');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(mon),'الأشهر');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(chunks),'tarteeb_backup');
  const data=new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})),name='ترتيب-نسخة-'+todayStr()+'.xlsx';
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data});toast('تم حفظ النسخة','good')}catch(e){if(e&&e.code!=='declined')toast('ما قدرنا نحفظ الملف هنا','bad')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل النسخة','good')}catch(e){toast('التنزيل غير متاح هنا','bad')}
}
function readBackup(wb){
  try{const rows=XLSX.utils.sheet_to_json(wb.Sheets['tarteeb_backup'],{header:1});const j=rows.slice(1).map(r=>r[0]||'').join('');return migrate(JSON.parse(j))}catch(e){return null}
}
